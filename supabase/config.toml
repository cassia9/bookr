# Supabase 項目配置
project_id = "xfdpcjpjpczqyuqzdqmr"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[storage]
file_size_limit = 52428800

[functions.invite-member]
verify_jwt = true

[functions.member-management]
verify_jwt = false

[functions.accept-invitation]
verify_jwt = false

[functions.send-invitation-email]
verify_jwt = true

# 公開 LIFF 預約不使用 Supabase Auth JWT；函式內會向 LINE 驗證 ID token，
# 再以後端角色呼叫 service-only RPC。
[functions.line-booking]
verify_jwt = false

# 由函式內使用 Supabase Auth 驗證登入者，並再次確認店家管理員角色。
[functions.line-messaging-settings]
verify_jwt = false
